services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartlog
      POSTGRES_PASSWORD: smartlog
      POSTGRES_DB: smartlog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
      - ./db/seeds/001_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlog -d smartlog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
